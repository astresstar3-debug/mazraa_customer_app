name: Flutter CI and Android Screenshots

on:
  pull_request:
    branches:
      - new
  push:
    branches:
      - new
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-emulator:
    name: Analyze, run Android emulator, and capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter beta
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app once on Android emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            flutter devices
            flutter drive --no-dds --driver=test_driver/integration_test.dart --target=integration_test/app_screenshots_test.dart -d emulator-5554

      - name: Upload debug APK produced by integration build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-screen-screenshots
          path: screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload integration response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-integration-output
          path: build/integration_response_data.json
          if-no-files-found: ignore
          retention-days: 7
